<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Bot Webowy</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --chat-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --input-bg: #313244;
            --border-color: #45475a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: rgba(0,0,0,0.2);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            background-color: var(--accent-color);
            color: #11111b;
            align-self: flex-end;
        }
        .message.bot {
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            resize: none;
            font-family: inherit;
            height: 24px;
            max-height: 150px;
        }
        button {
            background-color: var(--accent-color);
            color: #11111b;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Panel Bota</h3>
        <p style="font-size: 0.9rem; color: #a6adc8;">Brak limitów znaków! Pisz śmiało.</p>
    </div>

    <div class="main-chat">
        <div class="chat-header">Czat z Twoim Botem</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Cześć! Jestem gotowy do działania. Wpisz coś poniżej.</div>
        </div>
        <div class="chat-input-area">
            <textarea id="userInput" placeholder="Napisz wiadomość do bota..." rows="1"></textarea>
            <button id="sendBtn">Wyślij</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            setTimeout(() => {
                addMessage("Oto długa odpowiedź od bota bez żadnych limitów znaków! Możesz tu wygenerować cały artykuł, kod źródłowy czy raport...", "bot");
            }, 500);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
