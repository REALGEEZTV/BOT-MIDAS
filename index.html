<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Bot Webowy - Skarbiec KCD2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #161622;
            border-right: 1px solid #2a2a40;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .sidebar p {
            font-size: 0.9rem;
            color: #a0a0c0;
        }
        /* Main chat area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a2e;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a40;
            background-color: #1e1e2f;
        }
        .chat-header h1 {
            font-size: 1.3rem;
            color: #ffffff;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            background-color: #2b5278;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background-color: #262638;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #363650;
        }
        /* Input area */
        .chat-input-area {
            padding: 20px;
            background-color: #1e1e2f;
            border-top: 1px solid #2a2a40;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background-color: #161622;
            border: 1px solid #363650;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: #4a75a0;
        }
        .chat-input-area button {
            padding: 0 20px;
            background-color: #2b5278;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-input-area button:hover {
            background-color: #356392;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Panel Bota</h2>
        <p>Brak limitów znaków! Pisz śmiało.</p>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Czat z Twoim Botem</h1>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Cześć! Jestem gotowy do działania. Wpisz np. /poradnik lub /tablica.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Napisz wiadomość do bota..." autocomplete="off">
            <button onclick="handleSend()">Wyślij</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        // Wysyłanie po naciśnięciu klawisza Enter
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            // Tymczasowy komunikat "Myślę..."
            const loadingId = "bot-loading-" + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'bot');
            msgDiv.id = loadingId;
            msgDiv.textContent = "Myślę...";
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Wysyłamy zapytanie do Twojego lokalnego serwera w Pythonie
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Usuwamy napis "Myślę..." i wstawiamy odpowiedź od bota
                document.getElementById(loadingId).remove();
                addMessage(data.response || "Brak odpowiedzi od bota.", 'bot');

            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage("❌ Błąd połączenia z serwerem bota (sprawdź, czy Python działa w tle).", 'bot');
                console.error(error);
            }
        }
    </script>
</body>
</html>
