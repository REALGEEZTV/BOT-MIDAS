<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skarbiec Wioski - KCD2 RP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background-color: #161622;
            border-right: 1px solid #2a2a40;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .sidebar p {
            font-size: 0.9rem;
            color: #a0a0c0;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a2e;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a40;
            background-color: #1e1e2f;
        }
        .chat-header h1 {
            font-size: 1.3rem;
            color: #ffffff;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 95%;
            padding: 14px 18px;
            border-radius: 8px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            background-color: #2b5278;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background-color: #262638;
            color: #dcdcdc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 4px solid #d4af37;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: pre-wrap;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .message.bot code {
            font-family: Consolas, Monaco, monospace;
            background-color: #1e1e2f;
            display: block;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #363650;
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            overflow-x: auto;
        }
        /* Styl przycisków akcji */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background-color 0.2s;
        }
        .refresh-btn {
            background-color: #5865F2;
        }
        .refresh-btn:hover {
            background-color: #4752C4;
        }
        .search-btn {
            background-color: #e67e22;
        }
        .search-btn:hover {
            background-color: #d35400;
        }
        /* Stopka wiadomości */
        .msg-footer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #8888aa;
            border-top: 1px solid #363650;
            padding-top: 8px;
        }
        .chat-input-area {
            padding: 20px;
            background-color: #1e1e2f;
            border-top: 1px solid #2a2a40;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background-color: #161622;
            border: 1px solid #363650;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: #4a75a0;
        }
        .chat-input-area button {
            padding: 0 20px;
            background-color: #2b5278;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-input-area button:hover {
            background-color: #356392;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Panel Skarbnika</h2>
        <p>Zarządzaj podatkami i budżetem wioski KCD2 RP.</p>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Czat z Botem Midas</h1>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Witaj skarbniku! Wpisz **/poradnik** lub **/tablica**, aby zarządzać finansami wioski.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Wpisz komendę (np. /tablica, /dodaj)..." autocomplete="off">
            <button onclick="handleSend()">Wyślij</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        function formatBotResponse(text) {
            let footerHtml = '';
            // Oddzielamy stopkę od reszty wiadomości
            if (text.includes('Kingdom Come Deliverance 2 RP')) {
                const parts = text.split('Kingdom Come Deliverance 2 RP');
                text = parts[0];
                footerHtml = '<div class="msg-footer">Kingdom Come Deliverance 2 RP' + parts[1] + '</div>';
            }

            let formatted = text
                .replace(/```text\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/```\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            
            // Statusy mieszkańców
            formatted = formatted.replace(/\[ZALEGA\]/g, '<span style="color: #ff4d4d; font-weight: bold;">[ZALEGA]</span>');
            formatted = formatted.replace(/\[\s*OK\s*\]/g, '<span style="color: #4bb543; font-weight: bold;">[  OK  ]</span>');
            
            // Kolorowanie bilansu
            formatted = formatted.replace(/--- PRZYCHODY ---/g, '<span style="color: #4bb543; font-weight: bold;">--- PRZYCHODY ---</span>');
            formatted = formatted.replace(/RAZEM PRZYCHODY:/g, '<span style="color: #4bb543; font-weight: bold;">RAZEM PRZYCHODY:</span>');
            
            formatted = formatted.replace(/--- WYDATKI ---/g, '<span style="color: #ff4d4d; font-weight: bold;">--- WYDATKI ---</span>');
            formatted = formatted.replace(/RAZEM WYDATKI:/g, '<span style="color: #ff4d4d; font-weight: bold;">RAZEM WYDATKI:</span>');
            
            formatted = formatted.replace(/= STAN SKARBCA:/g, '<span style="color: #d4af37; font-weight: bold;">= STAN SKARBCA:</span>');
            
            // Pogrubienia markdown
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            
            return { content: formatted, footer: footerHtml };
        }

        async function sendCommand(commandText) {
            const text = commandText.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.classList.add('message', 'user');
            userMsg.textContent = text;
            chatMessages.appendChild(userMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const loadingId = "bot-loading-" + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'bot');
            msgDiv.id = loadingId;
            msgDiv.textContent = "Przetwarzanie zapytania...";
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const botBox = document.getElementById(loadingId);
                
                const resObj = formatBotResponse(data.response || "Brak odpowiedzi.");
                botBox.innerHTML = resObj.content;

                // Jeśli to tablica, dodajemy przyciski nad stopką
                if (text.toLowerCase().includes('/tablica')) {
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'action-buttons';

                    const refreshBtn = document.createElement('button');
                    refreshBtn.className = 'action-btn refresh-btn';
                    refreshBtn.innerHTML = '🔄 Odśwież';
                    refreshBtn.onclick = () => sendCommand('/tablica');

                    const searchBtn = document.createElement('button');
                    searchBtn.className = 'action-btn search-btn';
                    searchBtn.innerHTML = '🔍 Szukaj';
                    searchBtn.onclick = () => {
                        const query = prompt("Wpisz imię lub nazwisko podatnika do wyszukania:").toLowerCase();
                        if (!query) return;
                        const codeBlock = botBox.querySelector('pre code');
                        if (codeBlock) {
                            const lines = codeBlock.innerText.split('\n');
                            const filtered = lines.filter(line => 
                                line.toLowerCase().includes(query) || 
                                line.includes('Podatki Mieszkańców') || 
                                line.includes('---') || 
                                line.includes('Nieopłacone')
                            );
                            codeBlock.innerText = filtered.join('\n');
                        }
                    };

                    btnContainer.appendChild(refreshBtn);
                    btnContainer.appendChild(searchBtn);
                    botBox.appendChild(btnContainer);
                }

                // Dodajemy stopkę pod przyciskami
                if (resObj.footer) {
                    const footerDiv = document.createElement('div');
                    footerDiv.className = 'msg-footer';
                    footerDiv.innerHTML = resObj.footer;
                    botBox.appendChild(footerDiv);
                }

                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                const errDiv = document.createElement('div');
                errDiv.classList.add('message', 'bot');
                errDiv.textContent = "❌ Błąd połączenia z lokalnym serwerem Pythona (sprawdź, czy konsola działa).";
                chatMessages.appendChild(errDiv);
                console.error(error);
            }
        }

        function handleSend() {
            const text = userInput.value;
            userInput.value = '';
            sendCommand(text);
        }
    </script>
</body>
</html>
